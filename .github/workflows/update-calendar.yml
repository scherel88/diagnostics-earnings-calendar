name: Build calendar feed

on:
  push:
    paths:
      - "events*.json"
      - "results/**"
      - "generate_calendar.py"
      - "validate_calendar.py"
      - ".github/workflows/update-calendar.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: earnings-calendar-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate event records
        run: python validate_calendar.py

      - name: Generate ICS feed
        run: python generate_calendar.py

      - name: Avoid timestamp-only calendar rewrites
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          p = Path("earnings.ics")
          previous = subprocess.run(["git", "show", "HEAD:earnings.ics"], capture_output=True)
          if previous.returncode == 0:
              old = previous.stdout.decode("utf-8")
              new = p.read_bytes().decode("utf-8")
              clean = lambda s: re.sub(r"^(DTSTAMP|LAST-MODIFIED):[^\r\n]*", r"\1:UNCHANGED", s, flags=re.M)
              if clean(old) == clean(new):
                  p.write_bytes(previous.stdout)
                  print("No substantive calendar changes")
          PY

      - name: Validate generated calendar
        run: python validate_calendar.py --ics

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- earnings.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "diagnostics-earnings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings.ics
          git commit -m "Update earnings calendar feed"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push attempt $attempt failed; refetching current sources and regenerating feed"
            # A rebase of generated ICS can conflict if another run published first.
            # Rebuild from the latest remote source instead of merging calendar text.
            git fetch origin "${GITHUB_REF_NAME}" || exit 1
            git reset --hard "origin/${GITHUB_REF_NAME}" || exit 1
            python validate_calendar.py || exit 1
            python generate_calendar.py || exit 1
            python validate_calendar.py --ics || exit 1
            if git diff --quiet -- earnings.ics; then
              echo "Current remote calendar already matches source"
              exit 0
            fi
            git add earnings.ics
            git commit -m "Update earnings calendar feed" || exit 1
            sleep $((attempt * 5))
          done
          echo "Calendar publication failed after three attempts" >&2
          exit 1
